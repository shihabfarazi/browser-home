<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#eef2f8">
<meta name="color-scheme" content="light dark">

<title>Home Screen</title>

<style>
/* =========================================================
   ROOT / THEME
========================================================= */

:root {
    --bg: #edf1f7;
    --text: #111318;
    --secondary: rgba(17, 19, 24, .58);
    --muted: rgba(17, 19, 24, .38);

    --glass: rgba(255, 255, 255, .48);
    --glass-strong: rgba(255, 255, 255, .78);
    --glass-border: rgba(255, 255, 255, .72);

    --search-bg: rgba(255, 255, 255, .48);

    --accent: #007aff;
    --danger: #ff3b30;

    --shadow:
        0 20px 60px rgba(31, 42, 68, .10);

    --icon-shadow:
        0 12px 28px rgba(31, 42, 68, .16);

    --transition:
        240ms cubic-bezier(.22, .61, .36, 1);
}

html[data-theme="dark"] {
    --bg: #090b10;
    --text: #f5f5f7;
    --secondary: rgba(245, 245, 247, .58);
    --muted: rgba(245, 245, 247, .35);

    --glass: rgba(30, 33, 42, .58);
    --glass-strong: rgba(30, 33, 42, .84);
    --glass-border: rgba(255, 255, 255, .10);

    --search-bg: rgba(35, 38, 48, .65);

    --shadow:
        0 25px 80px rgba(0, 0, 0, .38);

    --icon-shadow:
        0 14px 32px rgba(0, 0, 0, .42);
}

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    color: var(--text);
    background: var(--bg);

    transition:
        color .4s ease,
        background .5s ease;
}

/* =========================================================
   WALLPAPER LAYER
========================================================= */

.wallpaper {
    position: fixed;
    inset: 0;
    z-index: -20;

    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;

    opacity: 0;

    transition:
        opacity .5s ease,
        filter .35s ease;
}

.wallpaper.has-image {
    opacity: 1;
}

.wallpaper-overlay {
    position: fixed;
    inset: 0;
    z-index: -19;

    pointer-events: none;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.02)
        );

    transition:
        background .4s ease;
}

html[data-theme="dark"] .wallpaper-overlay {
    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.35),
            rgba(0,0,0,.20)
        );
}

/* =========================================================
   DEFAULT AMBIENT BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: 0;
    z-index: -21;

    overflow: hidden;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(100,160,255,.25),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 15%,
            rgba(255,150,190,.20),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(120,220,190,.16),
            transparent 35%
        ),
        var(--bg);

    transition:
        opacity .5s ease;
}

.background::before,
.background::after {
    content: "";

    position: absolute;

    width: 45vw;
    height: 45vw;

    border-radius: 50%;

    filter: blur(90px);

    opacity: .25;

    animation:
        floatBlob 18s ease-in-out infinite alternate;
}

.background::before {
    top: -20%;
    left: -10%;

    background:
        linear-gradient(
            135deg,
            #5ea7ff,
            #b48cff
        );
}

.background::after {
    right: -15%;
    bottom: -20%;

    background:
        linear-gradient(
            135deg,
            #ff8db7,
            #75d9c5
        );

    animation-delay: -7s;
}

@keyframes floatBlob {

    from {
        transform:
            translate3d(0,0,0)
            scale(1);
    }

    to {
        transform:
            translate3d(5%,4%,0)
            scale(1.15);
    }

}

/* =========================================================
   MAIN
========================================================= */

.app {
    width:
        min(
            1200px,
            100%
        );

    min-height: 100vh;

    margin: auto;

    padding:
        max(32px, env(safe-area-inset-top))
        30px
        max(50px, env(safe-area-inset-bottom));
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

    margin-bottom: 30px;
}

.brand {
    display: flex;

    align-items: center;

    gap: 12px;
}

.greeting {
    font-size: 17px;

    font-weight: 700;

    letter-spacing: -.025em;
}

.top-actions {
    display: flex;

    gap: 8px;
}

/* =========================================================
   BUTTONS
========================================================= */

.glass-button {
    height: 42px;

    padding:
        0
        15px;

    border:
        1px solid
        var(--glass-border);

    border-radius: 14px;

    background:
        var(--glass);

    color:
        var(--text);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;

    transition:
        transform var(--transition),
        background var(--transition),
        box-shadow var(--transition);
}

.glass-button:hover {
    background:
        var(--glass-strong);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.08);
}

.glass-button:active {
    transform:
        scale(.94);
}

.glass-button svg {
    width: 17px;
}

.sync-status {
    font-size: 12px;
    color: var(--secondary);
    margin-left: 12px;
    white-space: nowrap;
    align-self: center;
}

/* =========================================================
   CLOCK
========================================================= */

.clock-section {
    text-align: center;

    margin:
        30px
        auto
        28px;
}

.clock {
    font-size:
        clamp(
            48px,
            8vw,
            94px
        );

    line-height: .95;

    font-weight: 700;

    letter-spacing: -.065em;

    font-variant-numeric:
        tabular-nums;

    text-shadow:
        0 8px 30px
        rgba(0,0,0,.08);
}

.clock-period {
    font-size: .30em;

    margin-left: 8px;

    font-weight: 600;

    letter-spacing: -.02em;

    opacity: .55;
}

.date {
    margin-top: 15px;

    font-size: 16px;

    font-weight: 500;

    color:
        var(--secondary);
}

/* =========================================================
   SEARCH
========================================================= */

.search-area {
    width:
        min(
            650px,
            100%
        );

    margin:
        0
        auto
        48px;
}

.search-box {
    position: relative;

    height: 52px;

    display: flex;

    align-items: center;

    border-radius: 18px;

    background:
        var(--search-bg);

    border:
        1px solid
        var(--glass-border);

    backdrop-filter:
        blur(30px)
        saturate(160%);

    -webkit-backdrop-filter:
        blur(30px)
        saturate(160%);

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.06);

    transition:
        box-shadow var(--transition),
        transform var(--transition);
}

.search-box:focus-within {
    box-shadow:
        0 15px 45px
        rgba(0,122,255,.12);

    transform:
        translateY(-1px);
}

.search-icon {
    width: 20px;

    margin-left: 17px;

    color:
        var(--secondary);
}

.search-input {
    flex: 1;

    height: 100%;

    padding:
        0
        15px;

    border: none;

    outline: none;

    background: transparent;

    color:
        var(--text);

    font-size: 16px;
}

.search-input::placeholder {
    color:
        var(--secondary);
}
.search-input:focus{
    border:none;
    outline:none;
}
.clear-search {
    width: 30px;
    height: 30px;

    margin-right: 10px;

    border: none;

    border-radius: 50%;

    background:
        rgba(120,120,128,.20);

    color:
        var(--text);

    display: none;

    place-items: center;

    cursor: pointer;
}

.clear-search.visible {
    display: grid;
}

/* =========================================================
   APP GRID
========================================================= */

.app-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                90px,
                1fr
            )
        );

    gap:
        34px
        24px;

    width:
        min(
            920px,
            100%
        );

    margin:
        0
        auto;
}

.app-item {
    position: relative;

    min-width: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    cursor: pointer;

    user-select: none;

    transition:
        transform var(--transition),
        opacity var(--transition);
}

.app-item:hover {
    transform:
        translateY(-6px);
}

.app-item:active {
    transform:
        scale(.90);
}

/* =========================================================
   SQUIRCLE
========================================================= */

.app-icon {
    position: relative;

    width:
        clamp(
            64px,
            8vw,
            82px
        );

    aspect-ratio: 1;

    display: grid;

    place-items: center;

    overflow: hidden;

    border-radius:
        27%;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.88),
            rgba(255,255,255,.28)
        );

    border:
        1px solid
        rgba(255,255,255,.65);

    box-shadow:
        var(--icon-shadow);

    transition:
        transform var(--transition),
        box-shadow var(--transition);
}

html[data-theme="dark"] .app-icon {
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.18),
            rgba(255,255,255,.04)
        );

    border-color:
        rgba(255,255,255,.12);
}

.app-item:hover .app-icon {
    transform:
        scale(1.06);

    box-shadow:
        0 18px 38px
        rgba(0,0,0,.18);
}

.app-icon img {
    width:
        48px;
    height:
        48px;

    object-fit:
        contain;

    border-radius:
        20%;
}

.fallback-icon {
    width: 100%;
    height: 100%;

    display: grid;

    place-items: center;

    color: white;

    font-size: 32px;

    font-weight: 700;

    background:
        linear-gradient(
            135deg,
            #007aff,
            #7c5cff
        );
}

/* =========================================================
   APP NAME
========================================================= */

.app-name {
    width: 100%;

    margin-top: 10px;

    padding:
        0
        3px;

    text-align: center;

    font-size: 13px;

    font-weight: 500;

    color:
        var(--text);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

/* =========================================================
   EDIT MODE
========================================================= */

.edit-mode .app-item {
    animation:
        editShake .32s ease-in-out
        infinite alternate;
}

@keyframes editShake {

    from {
        transform:
            rotate(-1deg);
    }

    to {
        transform:
            rotate(1deg);
    }

}

.app-controls {
    position: absolute;

    top: -9px;

    right:
        calc(
            50% - 46px
        );

    display: none;

    z-index: 5;
}

.edit-mode .app-controls {
    display: flex;
}

.control-button {
    width: 25px;
    height: 25px;

    border: none;

    border-radius: 50%;

    display: grid;

    place-items: center;

    color: white;

    background:
        var(--danger);

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.20);

    cursor: pointer;
}

.control-button.edit {
    background:
        var(--accent);

    margin-left: 5px;
}

.control-button svg {
    width: 13px;
}

/* =========================================================
   EMPTY
========================================================= */

.empty-state {
    display: none;

    text-align: center;

    padding:
        70px
        20px;

    color:
        var(--secondary);
}

.empty-state.visible {
    display: block;
}

.empty-state strong {
    display: block;

    color:
        var(--text);

    font-size: 18px;

    margin-bottom: 7px;
}

/* =========================================================
   MODALS / SHEETS
========================================================= */

.modal-overlay {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: flex-end;

    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.30);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);
}

.modal-overlay.active {
    display: flex;
}

.modal {
    width:
        min(
            460px,
            100%
        );

    max-height:
        calc(
            100vh - 40px
        );

    overflow-y: auto;

    padding: 25px;

    border:
        1px solid
        var(--glass-border);

    border-radius:
        28px;

    background:
        var(--glass-strong);

    backdrop-filter:
        blur(35px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(35px)
        saturate(150%);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.20);

    animation:
        sheetIn .35s
        cubic-bezier(.22,.61,.36,1);
}

@keyframes sheetIn {

    from {
        transform:
            translateY(40px);

        opacity: 0;
    }

    to {
        transform:
            translateY(0);

        opacity: 1;
    }

}

.modal-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 25px;
}

.modal-title {
    font-size: 21px;

    font-weight: 700;

    letter-spacing:
        -.03em;
}

.close-button {
    width: 34px;
    height: 34px;

    border: none;

    border-radius: 50%;

    display: grid;

    place-items: center;

    background:
        rgba(120,120,128,.16);

    color:
        var(--text);

    cursor: pointer;
}

.form-group {
    margin-bottom: 15px;
}

.form-label {
    display: block;

    margin:
        0
        0
        7px
        4px;

    font-size: 13px;

    font-weight: 600;

    color:
        var(--secondary);
}

.form-input {
    width: 100%;

    height: 50px;

    padding:
        0
        15px;

    border:
        1px solid
        var(--glass-border);

    border-radius: 15px;

    outline: none;

    background:
        var(--search-bg);

    color:
        var(--text);

    font-size: 15px;
}

.form-input:focus {
    border-color:
        rgba(0,122,255,.6);

    box-shadow:
        0 0 0 3px
        rgba(0,122,255,.12);
}

.form-error {
    min-height: 18px;

    margin-top: 6px;

    color:
        var(--danger);

    font-size: 12px;
}

.modal-actions {
    display: flex;

    gap: 10px;

    margin-top: 22px;
}

.modal-actions button {
    flex: 1;

    height: 48px;

    border: none;

    border-radius: 15px;

    font-weight: 600;

    cursor: pointer;
}

.cancel-button {
    background:
        rgba(120,120,128,.15);

    color:
        var(--text);
}

.save-button {
    background:
        var(--accent);

    color: white;
}

/* =========================================================
   ICON PREVIEW
========================================================= */

.icon-preview {
    width: 76px;
    height: 76px;

    margin:
        0
        auto
        22px;

    overflow: hidden;

    display: grid;

    place-items: center;

    border-radius: 27%;

    background:
        linear-gradient(
            135deg,
            #007aff,
            #7c5cff
        );

    box-shadow:
        var(--icon-shadow);
}

.icon-preview img {
    width: 70%;
    height: 70%;

    object-fit: contain;

    border-radius: 20%;
}

.icon-preview-letter {
    color: white;

    font-size: 32px;

    font-weight: 700;
}

.color-swatch {
    width: 34px;
    height: 34px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.5);
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
}

.upload-button {
    width: 100%;

    height: 48px;

    border:
        1px solid
        var(--glass-border);

    border-radius: 15px;

    background:
        var(--glass);

    color:
        var(--text);

    font-weight: 600;

    cursor: pointer;
}

/* =========================================================
   RANGE SLIDER
========================================================= */

.range-row {
    display: flex;

    align-items: center;

    gap: 12px;
}

.range-row input[type="range"] {
    flex: 1;

    accent-color:
        var(--accent);
}

.range-value {
    min-width: 48px;

    text-align: right;

    font-size: 13px;

    font-weight: 600;

    color:
        var(--secondary);
}

/* =========================================================
   THEME MENU
========================================================= */

.theme-menu {
    position: fixed;

    z-index: 2000;

    top: 70px;

    right: 25px;

    display: none;

    width: 180px;

    padding: 7px;

    border-radius: 18px;

    background:
        var(--glass-strong);

    border:
        1px solid
        var(--glass-border);

    backdrop-filter:
        blur(30px);

    box-shadow:
        var(--shadow);
}

.theme-menu.open {
    display: block;
}

.theme-option {
    width: 100%;

    padding:
        10px
        12px;

    border: none;

    border-radius: 12px;

    display: flex;

    align-items: center;

    gap: 10px;

    background: transparent;

    color:
        var(--text);

    text-align: left;

    cursor: pointer;
}

.theme-option:hover {
    background:
        rgba(120,120,128,.12);
}

.theme-option.active {
    background:
        rgba(0,122,255,.12);

    color:
        var(--accent);
}

/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;

    z-index: 3000;

    left: 50%;

    bottom: 30px;

    padding:
        12px
        18px;

    border-radius: 15px;

    background:
        rgba(30,30,35,.88);

    color: white;

    font-size: 13px;

    transform:
        translate(-50%,20px);

    opacity: 0;

    pointer-events: none;

    transition:
        .25s ease;
}

.toast.show {
    opacity: 1;

    transform:
        translate(-50%,0);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {

    .app {
        padding:
            max(25px, env(safe-area-inset-top))
            18px
            max(35px, env(safe-area-inset-bottom));
    }

    .greeting {
        font-size: 16px;
    }

    .topbar {
        margin-bottom: 20px;
    }

    .clock-section {
        margin-top: 30px;
        margin-bottom: 25px;
    }

    .clock {
        font-size:
            clamp(
                45px,
                15vw,
                70px
            );
    }

    .date {
        font-size: 14px;
    }

    .search-area {
        margin-bottom: 35px;
    }

    .app-grid {
        grid-template-columns:
            repeat(
                4,
                minmax(0,1fr)
            );

        gap:
            27px
            10px;
    }

    .app-icon {
        width:
            clamp(
                60px,
                17vw,
                75px
            );
    }

    .app-name {
        font-size: 11px;
    }

    .glass-button span {
        display: none;
    }

    .glass-button {
        width: 42px;

        padding: 0;
    }

    .modal-overlay {
        padding: 10px;
    }

    .modal {
        padding: 22px;

        border-radius:
            26px;
    }
}

@media (min-width: 701px) and (max-width: 1000px) {

    .app-grid {
        grid-template-columns:
            repeat(
                6,
                1fr
            );
    }
}

/* =========================================================
   ACCESSIBILITY
========================================================= */

button,
input {
    font: inherit;
}

button:focus-visible,
input:focus-visible {
    outline:
        3px solid
        rgba(0,122,255,.35);

    outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;
    }

}
</style>
</head>


<body>

<!-- BACKGROUND -->

<div
    id="wallpaper"
    class="wallpaper"
></div>

<div class="wallpaper-overlay"></div>

<div class="background"></div>


<div class="app">

    <!-- TOP BAR -->

    <header class="topbar">

        <div class="brand">

            <div
                id="greeting"
                class="greeting"
            >
                Hi, Shihab
            </div>

            <div
                id="syncStatus"
                class="sync-status"
            >
                Syncing...
            </div>

        </div>


        <div class="top-actions">

            <button
                class="glass-button"
                id="customizeButton"
                title="Customize"
            >

                <svg
                    viewBox="0 0 48 48"
                    fill="currentColor"
                    stroke="currentColor"
                    stroke-width="0"
                >
                    <circle cx="12" cy="12" r="3"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M41.5 10h-6m-8-4v8m0-4h-22m8 14h-8m16-4v8m22-4h-22m20 14h-6m-8-4v8m0-4h-22"/>
                </svg>

                

            </button>


            <button
                class="glass-button"
                id="themeButton"
                title="Theme"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    stroke="currentColor"

<script>

/* =========================================================
   STORAGE KEYS
========================================================= */

const APP_KEY =
    "ios-home-apps-v4";

const THEME_KEY =
    "ios-home-theme-v4";

const SETTINGS_KEY =
    "ios-home-settings-v4";

const DB_NAME =
    "ios-home-wallpaper-db";

const DB_STORE =
    "wallpapers";

const GIST_ID_KEY =
    'gist_id';

const GIST_TOKEN_KEY =
    'gist_token';

const BOOKMARKS_FILE =
    'bookmarks.json';

let gistSyncActive =
    false;

function normalizeGistId(
    input
) {
    return input
        .trim()
        .split('/')
        .filter(Boolean)
        .pop() || "";
}

function getGistCredentials() {
    const rawId =
        localStorage.getItem(
            GIST_ID_KEY
        ) || "";

    const gistId =
        normalizeGistId(
            rawId
        );

    const gistToken =
        localStorage.getItem(
            GIST_TOKEN_KEY
        ) || "";

    return {
        rawId,
        gistId,
        gistToken,
        enabled:
            Boolean(gistId && gistToken),
        apiUrl:
            gistId
                ? `https://api.github.com/gists/${gistId}`
                : ""
    };
}

function openGistSettingsModal(
    message = ""
) {
    const creds =
        getGistCredentials();

    gistIdInput.value =
        creds.rawId;

    gistTokenInput.value =
        creds.gistToken;

    gistModalError.textContent =
        message;

    syncSettingsModal.classList.add(
        "active"
    );
}

function closeGistSettingsModal() {
    syncSettingsModal.classList.remove(
        "active"
    );
}

function clearGistCredentials() {
    localStorage.removeItem(
        GIST_ID_KEY
    );

    localStorage.removeItem(
        GIST_TOKEN_KEY
    );

    updateSyncStatus(
        'Local storage only'
    );

    gistModalError.textContent =
        "";

    gistIdInput.value =
        "";

    gistTokenInput.value =
        "";
}

function saveGistCredentials() {
    const rawId =
        gistIdInput.value.trim();

    const gistToken =
        gistTokenInput.value.trim();

    const gistId =
        normalizeGistId(rawId);

    if (
        !gistId ||
        !gistToken
    ) {
        gistModalError.textContent =
            "Please enter both Gist ID and token.";
        return;
    }

    localStorage.setItem(
        GIST_ID_KEY,
        rawId
    );

    localStorage.setItem(
        GIST_TOKEN_KEY,
        gistToken
    );

    gistModalError.textContent =
        "";
    closeGistSettingsModal();
    updateSyncStatus('Syncing...');
    loadBookmarksFromGist();
}

function ensureGistCredentials() {
    const creds =
        getGistCredentials();

    if (!creds.enabled) {
        openGistSettingsModal(
            'Enter your Gist ID and token to enable sync.'
        );
        return false;
    }

    return true;
}

function handleInvalidGistCredentials(
    status
) {
    if (
        status === 401 ||
        status === 404
    ) {
        alert(
            'Gist credentials may be invalid or the Gist cannot be found. Please update them.'
        );

        openGistSettingsModal(
            'Invalid credentials or Gist not found.'
        );

        return true;
    }

    return false;
}


/* =========================================================
   DEFAULT APPS
========================================================= */

const defaultApps = [

    {
        id: crypto.randomUUID(),
        name: "Google",
        url: "https://www.google.com",
        customIcon: ""
    },

    {
        id: crypto.randomUUID(),
        name: "YouTube",

    },

    {
        id: crypto.randomUUID(),

    {

    },

    {

    }

];


/* =========================================================

========================================================= */

let apps =
    loadApps();

/* =========================================================

========================================================= */

const appGrid =
    document.getElementById(
        "appGrid"

        "customIconInput"

    );

        "iconColorHexInput"
    );

    document.getElementById(

const iconPreview =

    );

const iconPreviewLetter =
    document.getElementById(
        "iconPreviewLetter"

    document.getElementById(
        "formError"
    );

const wallpaper =
    document.getElementById(
        "wallpaper"

const greeting =
    document.getElementById(
        "greeting"
    );

    document.getElementById(
        "syncStatus"

    document.getElementById(
        "toast"
    );

    document.getElementById(
        "syncSettingsModal"
    );

    document.getElementById(
        "gistIdInput"

    document.getElementById(
        "gistTokenInput"
    );

const gistModalError =
    document.getElementById(
        "gistModalError"
    );


/* =========================================================
   LOCAL STORAGE
========================================================= */

function normalizeAppData(app) {
    return {
        id: app.id || crypto.randomUUID(),
        name: app.name || "",
        url: app.url || "",
        customIcon: app.customIcon || "",
        iconColor: app.iconColor || "#007aff"
    };
}

function loadApps() {

    try {

        const saved =
            localStorage.getItem(
                APP_KEY
            );

        if (!saved) {

            return defaultApps.map(normalizeAppData);

        }

        const parsed =
            JSON.parse(saved);

        return Array.isArray(parsed)
            ? parsed.map(normalizeAppData)
            : defaultApps.map(normalizeAppData);

    } catch {

        return defaultApps.map(normalizeAppData);

    }

}


function saveApps(sync = true) {

    localStorage.setItem(
        APP_KEY,
        JSON.stringify(apps)
    );

    if (sync) {
        syncAppsToGist();
    }

}

function updateSyncStatus(message) {
    if (syncStatus) {
        syncStatus.textContent =
            message;
    }
}

function handleGistError(error) {
    console.error('Gist sync failed', error);
    gistSyncActive = false;
    updateSyncStatus('Local storage only');
}

async function loadBookmarksFromGist() {
    const creds = getGistCredentials();

    if (!creds.enabled) {
        updateSyncStatus('Local storage only');
        openGistSettingsModal(
            'Enter your Gist ID and token to enable sync.'
        );
        return;
    }

    gistSyncActive = true;
    updateSyncStatus('Syncing...');

    try {
        const response = await fetch(
            creds.apiUrl,
            {
                headers: {
                    Authorization:
                        `Bearer ${creds.gistToken}`,
                    Accept:
                        'application/vnd.github.v3+json'
                }
            }
        );

        if (!response.ok) {
            if (
                handleInvalidGistCredentials(
                    response.status
                )
            ) {
                return;
            }
            throw new Error(
                `Gist load failed: ${response.status}`
            );
        }

        const data = await response.json();
        const content =
            data?.files?.[BOOKMARKS_FILE]?.content;

        if (typeof content !== 'string') {
            throw new Error('Missing bookmarks.json in gist');
        }

        let remoteApps = null;
        try {
            remoteApps = JSON.parse(content);
        } catch (parseError) {
            throw new Error('Corrupted gist bookmarks content');
        }

        if (Array.isArray(remoteApps)) {
            apps = remoteApps.map(normalizeAppData);
            saveApps(false);
            renderApps();
            updateSyncStatus('Synced');
        } else {
            throw new Error('Gist bookmarks content is not an array');
        }
    } catch (error) {
        handleGistError(error);
    } finally {
        gistSyncActive = false;
    }
}

async function syncAppsToGist() {
    const creds = getGistCredentials();

    if (!creds.enabled) {
        updateSyncStatus('Local storage only');
        return;
    }

    gistSyncActive = true;
    updateSyncStatus('Syncing...');

    try {
        const payload = {
            files: {
                [BOOKMARKS_FILE]: {
                    content: JSON.stringify(
                        apps,
                        null,
                        2
                    )
                }
            }
        };

        const response = await fetch(
            creds.apiUrl,
            {
                method: 'PATCH',
                headers: {
                    Authorization:
                        `Bearer ${creds.gistToken}`,
                    Accept:
                        'application/vnd.github.v3+json',
                    'Content-Type':
                        'application/json'
                },
                body: JSON.stringify(payload)
            }
        );

        if (!response.ok) {
            if (
                handleInvalidGistCredentials(
                    response.status
                )
            ) {
                return;
            }
            throw new Error(
                `Gist patch failed: ${response.status}`
            );
        }

        updateSyncStatus('Synced');
    } catch (error) {
        handleGistError(error);
    } finally {
        gistSyncActive = false;
    }
}


function loadSettings() {

    try {

        return {

            greeting:
                "Hi, Shihab",

            blur:
                0,

            dim:
                15,

            wallpaperUrl:
                "",

            ...JSON.parse(
                localStorage.getItem(
                    SETTINGS_KEY
                ) || "{}"
            )

        };

    } catch {

        return {

            greeting:
                "Hi, Shihab",

            blur:
                0,

            dim:
                15,

            wallpaperUrl:
                ""

        };

    }

}


function saveSettings() {

    localStorage.setItem(
        SETTINGS_KEY,
        JSON.stringify(
            settings
        )
    );

}


/* =========================================================
   FAVICON
========================================================= */

function getFavicon(url) {

    try {

        const domain =
            new URL(url).hostname;

        return (
            "https://www.google.com/s2/favicons" +
            "?domain=" +
            encodeURIComponent(domain) +
            "&sz=128"
        );

    } catch {

        return "";

    }

}


/* =========================================================
   ICON LOADING
========================================================= */

function loadIcon(
    img,
    app,
    fallback
) {

    const automaticIcon =
        getFavicon(
            app.url
        );


    /*
      Priority:

      1. Custom icon
      2. Google favicon
      3. Letter fallback
    */

const globeSvg =

function renderApps() {

    const query =
        searchInput.value
            .trim()
            .toLowerCase();


    const filtered =
        apps.filter(
            app =>
                app.name
                    .toLowerCase()
                    .includes(query)

                ||

                app.url
                    .toLowerCase()
                    .includes(query)
        );


    appGrid.innerHTML =
        "";


    filtered.forEach(
        app => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "app-item";


            item.addEventListener(
                "click",
                event => {

                    if (
                        event.target.closest(
                            ".app-controls"
                        )
                    ) {

                        return;

                    }

                    if (
                        editMode
                    ) {

                        return;

                    }

                    window.location.href =
                        app.url;

                }
            );


            let timer;


            item.addEventListener(
                "pointerdown",
                () => {

                    if (
                        editMode
                    ) {

                        return;

                    }

                    timer =
                        setTimeout(
                            enableEditMode,
                            650
                        );

                }
            );


            [
                "pointerup",
                "pointerleave",
                "pointercancel"
            ].forEach(
                eventName => {

                    item.addEventListener(
                        eventName,
                        () => {

                            clearTimeout(
                                timer
                            );

                        }
                    );

                }
            );


            /* Controls */

            const controls =
                document.createElement(
                    "div"
                );

            controls.className =
                "app-controls";


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "control-button";

            deleteButton.innerHTML =
                "×";


            deleteButton.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    deleteApp(
                        app.id

                }
            );


            const editButton =
                document.createElement(
                    "button"
                );

            editButton.className =
                "control-button edit";

            editButton.innerHTML =
                "✎";


            editButton.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    openEditModal(
                        app

                }
            );


            controls.appendChild(
                deleteButton
            );

            controls.appendChild(
                editButton
            );


            /* Icon */

                    const icon =
                document.createElement(
                    "div"
                );

            icon.className =
                "app-icon";


            const img =
                document.createElement(
                    "img"
                );

            img.alt =

            img.loading =
                "lazy";


            loadIcon(
                img,
                app,
                app.name

            icon.appendChild(

            name.title =

            item.appendChild(

            item.appendChild(

            appGrid.appendChild(
                item

function updateClock() {

    const now =
        new Date();


    let hours =
        now.getHours();


    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );


    const seconds =
        String(
            now.getSeconds()
        ).padStart(
            2,
            "0"
        );


    const period =
        hours >= 12
            ? "PM"
            : "AM";


    hours =
        hours % 12 || 12;


    document.getElementById(
        "clockTime"
    ).textContent =
        `${hours}:${minutes}:${seconds}`;


    document.getElementById(
        "clockPeriod"
    ).textContent =
        period;


    document.getElementById(
        "currentDate"
    ).textContent =
        new Intl.DateTimeFormat(
            undefined,
            {
                weekday:
                    "long",

                month:
                    "long",

                day:
                    "numeric"
            }
        ).format(
            now
        );

}

/* =========================================================
   ICON PREVIEW
========================================================= */

function isRawSvg(value) {
    return /^�|\s*<svg[\s>]/i.test(value);
}

function buildIconSrc(value, color = "#007aff") {
    const trimmed = value.trim();

    if (!trimmed) {
        return "";
    }

    if (trimmed.startsWith("data:image/svg+xml")) {
        const commaIndex =
            trimmed.indexOf(",");

        if (commaIndex !== -1) {
            const meta =
                trimmed.slice(
                    0,
                    commaIndex
                );
            const data =
                trimmed.slice(
                    commaIndex + 1
                );
            let svgText =
                data;
            try {
                if (/;base64/i.test(meta)) {
                    svgText =
                        atob(
                            data
                        );
                } else {
                    svgText =
                        decodeURIComponent(
                            data
                        );
                }

                if (/^<svg[\s>]/i.test(svgText)) {
                    return buildIconSrc(
                        svgText,
                        color
                    );
                }
            } catch {
                // fallback to raw data URL
            }
        }

        return trimmed;
    }

    if (/^<svg[\s>]/i.test(trimmed)) {
        try {
            const parser = new DOMParser();
            const doc = parser.parseFromString(trimmed, "image/svg+xml");
            const svg = doc.querySelector("svg");

            if (svg) {
                svg.querySelectorAll("*").forEach(node => {
                    if (node.nodeType !== Node.ELEMENT_NODE) {
                        return;
                    }

                    const element = node;
                    const fill = element.getAttribute("fill");
                    const stroke = element.getAttribute("stroke");

                    if (fill !== "none") {
                        element.setAttribute("fill", color);
                    }

                    if (stroke !== "none") {
                        element.setAttribute("stroke", color);
                    }

                    const style = element.getAttribute("style");
                    if (style) {
                        const normalized = style
                            .replace(/fill:\s*([^;]+)(;|$)/gi, `fill:${color}$2`)
                            .replace(/stroke:\s*([^;]+)(;|$)/gi, `stroke:${color}$2`);
                        element.setAttribute("style", normalized);
                    }
                });

                const serializer = new XMLSerializer();
                const svgString = serializer.serializeToString(svg);
                return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgString);
            }
        } catch (error) {
            console.warn("SVG parse failed", error);
        }

        return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(trimmed);
    }

    return trimmed;
}

/* =========================================================
   SAVE APP
======================================================== */

bookmarkForm.addEventListener(
    "submit",
    event => {

        event.preventDefault();


        const name =
            nameInput.value.trim();


        let url =
            urlInput.value.trim();


        const customIcon =
            customIconInput.value.trim();

        const iconColor =
            iconColorInput.value ||
            "#007aff";


        if (
            !/^https?:\/\//i.test(
                url
            )
        ) {

            url =
                "https://" +
                url;

        }


        try {

            const parsed =
                new URL(
                    url
                );


            if (
                ![
                    "http:",
                    "https:"
                ].includes(
                    parsed.protocol
                )
            ) {

                throw new Error();

            }

        } catch {

            formError.textContent =
                "Please enter a valid website URL.";

            return;

        }


        if (
            customIcon
        ) {

            if (
                /^<svg[\s>]/i.test(customIcon) ||
                customIcon.startsWith("data:image/svg+xml")
            ) {
                // valid raw SVG or data URL
            } else {
                try {

                    const parsedIcon =
                        new URL(
                            customIcon
                        );

                    if (
                        ![
                            "http:",
                            "https:"
                        ].includes(
                            parsedIcon.protocol
                        )
                    ) {

                        throw new Error();

                    }

                } catch {

                    formError.textContent =
                        "Please enter a valid icon URL or SVG markup.";

                    return;

                }
            }

        }


        if (
            editingId
        ) {

            apps =
                apps.map(
                    app =>
                        app.id === editingId
                            ? {
                                ...app,
                                name,
                                url,
                                customIcon,
                                iconColor
                            }
                            : app
                );


            showToast(
                "App updated"
            );

        } else {

            apps.push({

                id:
                    crypto.randomUUID(),

                name,

                url,

                customIcon,

                iconColor

            });


            showToast(
                "App added"
            );

        }


        saveApps();

        renderApps();

        closeAppModal();

    }
);

function deleteApp(
    id
) {

    const app =
        apps.find(
            item =>
                item.id === id
        );


    if (
        !app
    ) {

        return;

    }


    if (
        !confirm(
            `Remove "${app.name}" from your Home Screen?`
        )
    ) {

        return;

    }


    apps =
        apps.filter(
            item =>
                item.id !== id
        );


    saveApps();

    renderApps();

    showToast(
        "App removed"
    );

}

/* =========================================================
   INDEXEDDB WALLPAPER STORAGE
========================================================= */

function openDB() {

    return new Promise(
        (resolve, reject) => {

            const request =
                indexedDB.open(
                    DB_NAME,
                    1
                );


            request.onupgradeneeded =
                () => {

                    const db =
                        request.result;


                    if (
                        !db.objectStoreNames
                            .contains(
                                DB_STORE
                            )
                    ) {

                        db.createObjectStore(
                            DB_STORE
                        );

                    }

                };


            request.onsuccess =
                () =>
                    resolve(
                        request.result
                    );


            request.onerror =
                () =>
                    reject(
                        request.error
                    );

        }
    );

}


async function saveWallpaper(
    blob
) {

    const db =
        await openDB();


    return new Promise(
        (resolve, reject) => {

            const transaction =
                db.transaction(
                    DB_STORE,
                    "readwrite"
                );


            transaction.objectStore(
                DB_STORE
            ).put(
                blob,
                "wallpaper"
            );


            transaction.oncomplete =
                resolve;


            transaction.onerror =
                () =>
                    reject(
                        transaction.error
                    );

        }
    );

}


async function getWallpaper() {

    try {

        const db =
            await openDB();


        return new Promise(
            resolve => {

                const request =
                    db.transaction(
                        DB_STORE,
                        "readonly"
                    )
                    .objectStore(
                        DB_STORE
                    )
                    .get(
                        "wallpaper"
                    );


                request.onsuccess =
                    () =>
                        resolve(
                            request.result
                        );


                request.onerror =
                    () =>
                        resolve(
                            null
                        );

            }
        );

    } catch {

        return null;

    }

}


async function deleteWallpaper() {

    const db =
        await openDB();


    return new Promise(
        resolve => {

            const request =
                db.transaction(
                    DB_STORE,
                    "readwrite"
                )
                .objectStore(
                    DB_STORE
                )
                .delete(
                    "wallpaper"
                );


            request.onsuccess =
                resolve;

        }
    );

}

        .getElementById(
            "blurSlider"
        )
        .value =
        settings.blur;


    document
        .getElementById(
            "dimSlider"
        )
        .value =
        settings.dim;


    updateSliderLabels();

    customizeModal.classList.add(
        "active"
    );

}


document
    .getElementById(
        "customizeButton"
    )
    .addEventListener(
        "click",
        openCustomize
    );


document
    .getElementById(
        "closeCustomizeModal"
    )
    .addEventListener(
        "click",
        () =>
            customizeModal.classList.remove(
                "active"
            )
    );


/* =========================================================
   GREETING
========================================================= */

document
    .getElementById(
        "greetingInput"
    )
    .addEventListener(
        "input",
        event => {

            greeting.textContent =
                event.target.value;

        }
    );


/* =========================================================
   SLIDERS
========================================================= */

function updateSliderLabels() {

    const blur =
        Number(
            document
                .getElementById(
                    "blurSlider"
                )
                .value
        );


    const dim =
        Number(
            document
                .getElementById(
                    "dimSlider"
                )
                .value
        );


    document
        .getElementById(
            "blurValue"
        )
        .textContent =
        `${blur}px`;


    document
        .getElementById(
            "dimValue"
        )
        .textContent =
        `${dim}%`;


    wallpaper.style.filter =
        `blur(${blur}px)`;


    wallpaper.style.transform =
        blur > 0
            ? `scale(${1 + blur / 100})`
            : "scale(1)";


    document
        .querySelector(
            ".wallpaper-overlay"
        )
        .style.background =
        `rgba(0,0,0,${dim / 100})`;

}


document
    .getElementById(
        "blurSlider"
    )
    .addEventListener(
        "input",
        updateSliderLabels
    );


document
    .getElementById(
        "dimSlider"
    )
    .addEventListener(
        "input",
        updateSliderLabels
    );


/* =========================================================
   UPLOAD WALLPAPER
========================================================= */

document
    .getElementById(
        "uploadWallpaperButton"
    )
    .addEventListener(
        "click",
        () =>
            document
                .getElementById(
                    "wallpaperFile"
                )
                .click()
    );


document
    .getElementById(
        "wallpaperFile"
    )
    .addEventListener(
        "change",
        async event => {

            const file =
                event.target.files[0];


            if (
                !file
            ) {

                return;

            }


            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                showToast(
                    "Please select an image."
                );

                return;

            }


            try {

                await saveWallpaper(
                    file
                );


                settings.wallpaperUrl =
                    "";


                saveSettings();


                const url =
                    URL.createObjectURL(
                        file
                    );


                wallpaper.style.backgroundImage =
                    `url("${url}")`;


                wallpaper.classList.add(
                    "has-image"
                );


                showToast(
                    "Wallpaper updated"
                );

            } catch {

                showToast(
                    "Could not save wallpaper"
                );

            }

        }
    );


/* =========================================================
   WALLPAPER URL
========================================================= */

document
    .getElementById(
        "wallpaperUrl"
    )
    .addEventListener(
        "change",
        event => {

            const url =
                event.target.value.trim();


            if (
                !url
            ) {

                return;

            }


            try {

                new URL(
                    url
                );

            } catch {

                showToast(
                    "Invalid wallpaper URL"
                );

                return;

            }


            settings.wallpaperUrl =
                url;


            wallpaper.style.backgroundImage =
                `url("${url}")`;


            wallpaper.classList.add(
                "has-image"
            );

        }
    );


/* =========================================================
   REMOVE WALLPAPER
========================================================= */

document
    .getElementById(
        "removeWallpaperButton"
    )
    .addEventListener(
        "click",
        async () => {

            await deleteWallpaper();


            settings.wallpaperUrl =
                "";


            wallpaper.style.backgroundImage =
                "";


            wallpaper.classList.remove(
                "has-image"
            );


            saveSettings();


            showToast(
                "Wallpaper removed"
            );

        }
    );


/* =========================================================
   SAVE CUSTOMIZATION
========================================================= */

document
    .getElementById(
        "saveCustomizeButton"
    )
    .addEventListener(
        "click",
        () => {

            settings.greeting =
                document
                    .getElementById(
                        "greetingInput"
                    )
                    .value
                    .trim();


            settings.wallpaperUrl =
                document
                    .getElementById(
                        "wallpaperUrl"
                    )
                    .value
                    .trim();


            settings.blur =
                Number(
                    document
                        .getElementById(
                            "blurSlider"
                        )
                        .value
                );


            settings.dim =
                Number(
                    document
                        .getElementById(
                            "dimSlider"
                        )
                        .value
                );


            greeting.textContent =
                settings.greeting;


            saveSettings();

            applyWallpaperStyle();

            customizeModal.classList.remove(
                "active"
            );

            showToast(
                "Customization saved"
            );

        }
    );


document
    .getElementById(
        "syncSettingsButton"
    )
    .addEventListener(
        "click",
        () => {
            openGistSettingsModal();
        }
    );


document
    .getElementById(
        "closeGistSettingsModal"
    )
    .addEventListener(
        "click",
        () => {
            closeGistSettingsModal();
        }
    );


document
    .getElementById(
        "gistSettingsForm"
    )
    .addEventListener(
        "submit",
        event => {
            event.preventDefault();
            saveGistCredentials();
        }
    );


document
    .getElementById(
        "clearGistCredentialsButton"
    )
    .addEventListener(
        "click",
        () => {
            clearGistCredentials();
        }
    );


/* =========================================================
   INITIALIZE WALLPAPER
========================================================= */

greeting.textContent =
    settings.greeting;

applyWallpaperStyle();

loadSavedWallpaper();

loadBookmarksFromGist();


/* =========================================================
   CLOSE MODALS ON BACKDROP
========================================================= */

[
    appModal,
    customizeModal,
    syncSettingsModal
].forEach(
    modal => {

        modal.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    modal
                ) {

                    modal.classList.remove(
                        "active"
                    );

                }

            }
        );

    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Escape"
        ) {

            appModal.classList.remove(
                "active"
            );

            customizeModal.classList.remove(
                "active"
            );

            document
                .getElementById(
                    "themeMenu"
                )
                .classList.remove(
                    "open"
                );

        }


        if (
            event.key === "/"
            &&
            document.activeElement.tagName !==
            "INPUT"
        ) {

            event.preventDefault();

            searchInput.focus();

        }

    }
);


/* =========================================================
   SYSTEM THEME CHANGES
========================================================= */

window
    .matchMedia(
        "(prefers-color-scheme: dark)"
    )
    .addEventListener(
        "change",
        () => {

            if (
                (
                    localStorage.getItem(
                        THEME_KEY
                    ) || "system"
                ) === "system"
            ) {

                applyTheme(
                    "system"
                );

            }

        }
    );


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(
    message
) {

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================================
   INITIAL RENDER
========================================================= */

renderApps();

</script>

</body>
</html>
