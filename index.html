<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#eef2f8">
<meta name="color-scheme" content="light dark">

<title>Home Screen</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
/* =========================================================
   ROOT / THEME
========================================================= */

:root {
    --bg: #edf1f7;
    --text: #111318;
    --secondary: rgba(17, 19, 24, .58);
    --muted: rgba(17, 19, 24, .38);

    --glass: rgba(255, 255, 255, .48);
    --glass-strong: rgba(255, 255, 255, .78);
    --glass-border: rgba(255, 255, 255, .72);

    --search-bg: rgba(255, 255, 255, .48);

    --accent: #007aff;
    --danger: #ff3b30;

    --shadow:
        0 20px 60px rgba(31, 42, 68, .10);

    --icon-shadow:
        0 12px 28px rgba(31, 42, 68, .16);

    --transition:
        240ms cubic-bezier(.22, .61, .36, 1);
}

html[data-theme="dark"] {
    --bg: #090b10;
    --text: #f5f5f7;
    --secondary: rgba(245, 245, 247, .58);
    --muted: rgba(245, 245, 247, .35);

    --glass: rgba(30, 33, 42, .58);
    --glass-strong: rgba(30, 33, 42, .84);
    --glass-border: rgba(255, 255, 255, .10);

    --search-bg: rgba(35, 38, 48, .65);

    --shadow:
        0 25px 80px rgba(0, 0, 0, .38);

    --icon-shadow:
        0 14px 32px rgba(0, 0, 0, .42);
}

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    color: var(--text);
    background: var(--bg);

    transition:
        color .4s ease,
        background .5s ease;
}

/* =========================================================
   WALLPAPER LAYER
========================================================= */

.wallpaper {
    position: fixed;
    inset: 0;
    z-index: -20;

    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;

    opacity: 0;

    transition:
        opacity .5s ease,
        filter .35s ease;
}

.wallpaper.has-image {
    opacity: 1;
}

.wallpaper-overlay {
    position: fixed;
    inset: 0;
    z-index: -19;

    pointer-events: none;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.02)
        );

    transition:
        background .4s ease;
}

html[data-theme="dark"] .wallpaper-overlay {
    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.35),
            rgba(0,0,0,.20)
        );
}

/* =========================================================
   DEFAULT AMBIENT BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: 0;
    z-index: -10;

    overflow: hidden;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(100,160,255,.25),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 15%,
            rgba(255,150,190,.20),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(120,220,190,.16),
            transparent 35%
        ),
        var(--bg);

    transition:
        opacity .5s ease;
}

.background::before,
.background::after {
    content: "";

    position: absolute;

    width: 45vw;
    height: 45vw;

    border-radius: 50%;

    filter: blur(90px);

    opacity: .25;

    animation:
        floatBlob 18s ease-in-out infinite alternate;
}

.background::before {
    top: -20%;
    left: -10%;

    background:
        linear-gradient(
            135deg,
            #5ea7ff,
            #b48cff
        );
}

.background::after {
    right: -15%;
    bottom: -20%;

    background:
        linear-gradient(
            135deg,
            #ff8db7,
            #75d9c5
        );

    animation-delay: -7s;
}

@keyframes floatBlob {

    from {
        transform:
            translate3d(0,0,0)
            scale(1);
    }

    to {
        transform:
            translate3d(5%,4%,0)
            scale(1.15);
    }

}

/* =========================================================
   MAIN
========================================================= */

.app {
    width:
        min(
            1200px,
            100%
        );

    min-height: 100vh;

    margin: auto;

    padding:
        max(32px, env(safe-area-inset-top))
        30px
        max(50px, env(safe-area-inset-bottom));
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

    margin-bottom: 30px;
}

.brand {
    display: flex;

    align-items: center;

    gap: 12px;
}

.greeting {
    font-size: 17px;

    font-weight: 700;

    letter-spacing: -.025em;
}

.top-actions {
    display: flex;

    gap: 8px;
}

/* =========================================================
   BUTTONS
========================================================= */

.glass-button {
    height: 42px;

    padding:
        0
        15px;

    border:
        1px solid
        var(--glass-border);

    border-radius: 14px;

    background:
        var(--glass);

    color:
        var(--text);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;

    transition:
        transform var(--transition),
        background var(--transition),
        box-shadow var(--transition);
}

.glass-button:hover {
    background:
        var(--glass-strong);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.08);
}

.glass-button:active {
    transform:
        scale(.94);
}

.glass-button svg {
    width: 17px;
}

/* =========================================================
   CLOCK
========================================================= */

.clock-section {
    text-align: center;

    margin:
        30px
        auto
        28px;
}

.clock {
    font-size:
        clamp(
            48px,
            8vw,
            94px
        );

    line-height: .95;

    font-weight: 700;

    letter-spacing: -.065em;

    font-variant-numeric:
        tabular-nums;

    text-shadow:
        0 8px 30px
        rgba(0,0,0,.08);
}

.clock-period {
    font-size: .30em;

    margin-left: 8px;

    font-weight: 600;

    letter-spacing: -.02em;

    opacity: .55;
}

.date {
    margin-top: 15px;

    font-size: 16px;

    font-weight: 500;

    color:
        var(--secondary);
}

/* =========================================================
   SEARCH
========================================================= */

.search-area {
    width:
        min(
            650px,
            100%
        );

    margin:
        0
        auto
        48px;
}

.search-box {
    position: relative;

    height: 52px;

    display: flex;

    align-items: center;

    border-radius: 18px;

    background:
        var(--search-bg);

    border:
        1px solid
        var(--glass-border);

    backdrop-filter:
        blur(30px)
        saturate(160%);

    -webkit-backdrop-filter:
        blur(30px)
        saturate(160%);

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.06);

    transition:
        box-shadow var(--transition),
        transform var(--transition);
}

.search-box:focus-within {
    box-shadow:
        0 15px 45px
        rgba(0,122,255,.12);

    transform:
        translateY(-1px);
}

.search-icon {
    width: 20px;

    margin-left: 17px;

    color:
        var(--secondary);
}

.search-input {
    flex: 1;

    height: 100%;

    padding:
        0
        15px;

    border: none;

    outline: none;

    background: transparent;

    color:
        var(--text);

    font-size: 16px;
}

.search-input::placeholder {
    color:
        var(--secondary);
}
.search-input:focus{
    border:none;
    outline:none;
}
.clear-search {
    width: 30px;
    height: 30px;

    margin-right: 10px;

    border: none;

    border-radius: 50%;

    background:
        rgba(120,120,128,.20);

    color:
        var(--text);

    display: none;

    place-items: center;

    cursor: pointer;
}

.clear-search.visible {
    display: grid;
}

/* =========================================================
   APP GRID
========================================================= */

.app-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                90px,
                1fr
            )
        );

    gap:
        34px
        24px;

    width:
        min(
            920px,
            100%
        );

    margin:
        0
        auto;
}

.app-item {
    position: relative;

    min-width: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    cursor: pointer;

    user-select: none;

    transition:
        transform var(--transition),
        opacity var(--transition);
}

.app-item:hover {
    transform:
        translateY(-6px);
}

.app-item:active {
    transform:
        scale(.90);
}

/* =========================================================
   SQUIRCLE
========================================================= */

.app-icon {
    position: relative;

    width:
        clamp(
            64px,
            8vw,
            82px
        );

    aspect-ratio: 1;

    display: grid;

    place-items: center;

    overflow: hidden;

    border-radius:
        27%;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.88),
            rgba(255,255,255,.28)
        );

    border:
        1px solid
        rgba(255,255,255,.65);

    box-shadow:
        var(--icon-shadow);

    transition:
        transform var(--transition),
        box-shadow var(--transition);
}

html[data-theme="dark"] .app-icon {
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.18),
            rgba(255,255,255,.04)
        );

    border-color:
        rgba(255,255,255,.12);
}

.app-item:hover .app-icon {
    transform:
        scale(1.06);

    box-shadow:
        0 18px 38px
        rgba(0,0,0,.18);
}

.app-icon img {
    width: 68%;
    height: 68%;

    object-fit: contain;

    border-radius: 20%;
}

.fallback-icon {
    width: 100%;
    height: 100%;

    display: grid;

    place-items: center;

    color: white;

    font-size: 32px;

    font-weight: 700;

    background:
        linear-gradient(
            135deg,
            #007aff,
            #7c5cff
        );
}

/* =========================================================
   APP NAME
========================================================= */

.app-name {
    width: 100%;

    margin-top: 10px;

    padding:
        0
        3px;

    text-align: center;

    font-size: 13px;

    font-weight: 500;

    color:
        var(--text);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

/* =========================================================
   EDIT MODE
========================================================= */

.edit-mode .app-item {
    animation:
        editShake .32s ease-in-out
        infinite alternate;
}

@keyframes editShake {

    from {
        transform:
            rotate(-1deg);
    }

    to {
        transform:
            rotate(1deg);
    }

}

.app-controls {
    position: absolute;

    top: -9px;

    right:
        calc(
            50% - 46px
        );

    display: none;

    z-index: 5;
}

.edit-mode .app-controls {
    display: flex;
}

.control-button {
    width: 25px;
    height: 25px;

    border: none;

    border-radius: 50%;

    display: grid;

    place-items: center;

    color: white;

    background:
        var(--danger);

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.20);

    cursor: pointer;
}

.control-button.edit {
    background:
        var(--accent);

    margin-left: 5px;
}

.control-button svg {
    width: 13px;
}

/* =========================================================
   EMPTY
========================================================= */

.empty-state {
    display: none;

    text-align: center;

    padding:
        70px
        20px;

    color:
        var(--secondary);
}

.empty-state.visible {
    display: block;
}

.empty-state strong {
    display: block;

    color:
        var(--text);

    font-size: 18px;

    margin-bottom: 7px;
}

/* =========================================================
   MODALS / SHEETS
========================================================= */

.modal-overlay {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: flex-end;

    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.30);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);
}

.modal-overlay.active {
    display: flex;
}

.modal {
    width:
        min(
            460px,
            100%
        );

    max-height:
        calc(
            100vh - 40px
        );

    overflow-y: auto;

    padding: 25px;

    border:
        1px solid
        var(--glass-border);

    border-radius:
        28px;

    background:
        var(--glass-strong);

    backdrop-filter:
        blur(35px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(35px)
        saturate(150%);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.20);

    animation:
        sheetIn .35s
        cubic-bezier(.22,.61,.36,1);
}

@keyframes sheetIn {

    from {
        transform:
            translateY(40px);

        opacity: 0;
    }

    to {
        transform:
            translateY(0);

        opacity: 1;
    }

}

.modal-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 25px;
}

.modal-title {
    font-size: 21px;

    font-weight: 700;

    letter-spacing:
        -.03em;
}

.close-button {
    width: 34px;
    height: 34px;

    border: none;

    border-radius: 50%;

    display: grid;

    place-items: center;

    background:
        rgba(120,120,128,.16);

    color:
        var(--text);

    cursor: pointer;
}

.form-group {
    margin-bottom: 15px;
}

.form-label {
    display: block;

    margin:
        0
        0
        7px
        4px;

    font-size: 13px;

    font-weight: 600;

    color:
        var(--secondary);
}

.form-input {
    width: 100%;

    height: 50px;

    padding:
        0
        15px;

    border:
        1px solid
        var(--glass-border);

    border-radius: 15px;

    outline: none;

    background:
        var(--search-bg);

    color:
        var(--text);

    font-size: 15px;
}

.form-input:focus {
    border-color:
        rgba(0,122,255,.6);

    box-shadow:
        0 0 0 3px
        rgba(0,122,255,.12);
}

.form-error {
    min-height: 18px;

    margin-top: 6px;

    color:
        var(--danger);

    font-size: 12px;
}

.modal-actions {
    display: flex;

    gap: 10px;

    margin-top: 22px;
}

.modal-actions button {
    flex: 1;

    height: 48px;

    border: none;

    border-radius: 15px;

    font-weight: 600;

    cursor: pointer;
}

.cancel-button {
    background:
        rgba(120,120,128,.15);

    color:
        var(--text);
}

.save-button {
    background:
        var(--accent);

    color: white;
}

/* =========================================================
   ICON PREVIEW
========================================================= */

.icon-preview {
    width: 76px;
    height: 76px;

    margin:
        0
        auto
        22px;

    overflow: hidden;

    display: grid;

    place-items: center;

    border-radius: 27%;

    background:
        linear-gradient(
            135deg,
            #007aff,
            #7c5cff
        );

    box-shadow:
        var(--icon-shadow);
}

.icon-preview img {
    width: 70%;
    height: 70%;

    object-fit: contain;

    border-radius: 20%;
}

.icon-preview-letter {
    color: white;

    font-size: 32px;

    font-weight: 700;
}

/* =========================================================
   FILE INPUT
========================================================= */

.file-input {
    display: none;
}

.upload-button {
    width: 100%;

    height: 48px;

    border:
        1px solid
        var(--glass-border);

    border-radius: 15px;

    background:
        var(--glass);

    color:
        var(--text);

    font-weight: 600;

    cursor: pointer;
}

/* =========================================================
   RANGE SLIDER
========================================================= */

.range-row {
    display: flex;

    align-items: center;

    gap: 12px;
}

.range-row input[type="range"] {
    flex: 1;

    accent-color:
        var(--accent);
}

.range-value {
    min-width: 48px;

    text-align: right;

    font-size: 13px;

    font-weight: 600;

    color:
        var(--secondary);
}

/* =========================================================
   THEME MENU
========================================================= */

.theme-menu {
    position: fixed;

    z-index: 2000;

    top: 70px;

    right: 25px;

    display: none;

    width: 180px;

    padding: 7px;

    border-radius: 18px;

    background:
        var(--glass-strong);

    border:
        1px solid
        var(--glass-border);

    backdrop-filter:
        blur(30px);

    box-shadow:
        var(--shadow);
}

.theme-menu.open {
    display: block;
}

.theme-option {
    width: 100%;

    padding:
        10px
        12px;

    border: none;

    border-radius: 12px;

    display: flex;

    align-items: center;

    gap: 10px;

    background: transparent;

    color:
        var(--text);

    text-align: left;

    cursor: pointer;
}

.theme-option:hover {
    background:
        rgba(120,120,128,.12);
}

.theme-option.active {
    background:
        rgba(0,122,255,.12);

    color:
        var(--accent);
}

/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;

    z-index: 3000;

    left: 50%;

    bottom: 30px;

    padding:
        12px
        18px;

    border-radius: 15px;

    background:
        rgba(30,30,35,.88);

    color: white;

    font-size: 13px;

    transform:
        translate(-50%,20px);

    opacity: 0;

    pointer-events: none;

    transition:
        .25s ease;
}

.toast.show {
    opacity: 1;

    transform:
        translate(-50%,0);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {

    .app {
        padding:
            max(25px, env(safe-area-inset-top))
            18px
            max(35px, env(safe-area-inset-bottom));
    }

    .greeting {
        font-size: 16px;
    }

    .topbar {
        margin-bottom: 20px;
    }

    .clock-section {
        margin-top: 30px;
        margin-bottom: 25px;
    }

    .clock {
        font-size:
            clamp(
                45px,
                15vw,
                70px
            );
    }

    .date {
        font-size: 14px;
    }

    .search-area {
        margin-bottom: 35px;
    }

    .app-grid {
        grid-template-columns:
            repeat(
                4,
                minmax(0,1fr)
            );

        gap:
            27px
            10px;
    }

    .app-icon {
        width:
            clamp(
                60px,
                17vw,
                75px
            );
    }

    .app-name {
        font-size: 11px;
    }

    .glass-button span {
        display: none;
    }

    .glass-button {
        width: 42px;

        padding: 0;
    }

    .modal-overlay {
        padding: 10px;
    }

    .modal {
        padding: 22px;

        border-radius:
            26px;
    }
}

@media (min-width: 701px) and (max-width: 1000px) {

    .app-grid {
        grid-template-columns:
            repeat(
                6,
                1fr
            );
    }
}

/* =========================================================
   ACCESSIBILITY
========================================================= */

button,
input {
    font: inherit;
}

button:focus-visible,
input:focus-visible {
    outline:
        3px solid
        rgba(0,122,255,.35);

    outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;
    }

}
</style>
</head>


<body>

<!-- BACKGROUND -->

<div
    id="wallpaper"
    class="wallpaper"
></div>

<div class="wallpaper-overlay"></div>

<div class="background"></div>


<div class="app">

    <!-- TOP BAR -->

    <header class="topbar">

        <div class="brand">

            <div
                id="greeting"
                class="greeting"
            >
                Hi, Shihab
            </div>

        </div>


        <div class="top-actions">

            <button
                class="glass-button"
                id="editModeButton"
                title="Edit Home Screen"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <path d="M12 20h9"/>
                    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                </svg>

                <span>Edit</span>

            </button>


            <button
                class="glass-button"
                id="customizeButton"
                title="Customize"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <circle cx="12" cy="12" r="3"/>

/* =========================================================

function loadApps() {

            return defaultApps;

        }

        const parsed =
            JSON.parse(saved);

        return Array.isArray(parsed)
            ? parsed
            : defaultApps;

    } catch {

        return defaultApps;

    }

}


function saveApps() {

    localStorage.setItem(
        APP_KEY,
        JSON.stringify(apps)

}

async function initializeGoogleSync() {
    if (!window.google?.accounts?.oauth2) {
        window.setTimeout(initializeGoogleSync, 200);
        return;
    }

    googleTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPE,
        include_granted_scopes: true,
        callback: async response => {
            if (response.error) {
                const message = response.error_description || response.error || 'Google sign in failed';
                console.error('Google sign in error:', message, response);
                showToast(`Google sign in failed: ${message}`);
                updateGoogleSignInButton();
                return;
            }
            googleAccessToken = response.access_token;
            console.log('Google access token acquired');
            await loadBookmarksFromDrive();
            updateGoogleSignInButton();
            showToast('Google Drive sync enabled');
        }
    });

    console.log('Google sync initialized');
    updateGoogleSignInButton();

    try {
        googleTokenClient.requestAccessToken({ prompt: '' });
    } catch (error) {
        console.warn('Silent Google auth not available yet', error);
    }
}

function updateGoogleSignInButton() {
    const signInLabel = document.getElementById('googleSignInLabel');
    const button = document.getElementById('googleSignInButton');
    if (!signInLabel || !button) return;

    if (googleAccessToken) {
        signInLabel.textContent = 'Signed in';
        button.title = 'Sign out of Google';
    } else {
        signInLabel.textContent = 'Sign in';
        button.title = 'Sign in with Google';
    }
}

function signInWithGoogle() {
    if (!googleTokenClient) {
        showToast('Google auth is not ready yet. Retrying...');
        initializeGoogleSync();
        window.setTimeout(signInWithGoogle, 400);
        return;
    }
    console.log('Requesting Google access token');
    googleTokenClient.requestAccessToken({ prompt: 'consent' });
}

function signOutOfGoogle() {
    googleAccessToken = null;
    googleDriveFileId = null;
    updateGoogleSignInButton();
    showToast('Signed out of Google');
}

async function fetchDriveFileInfo() {
    const query = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and 'appDataFolder' in parents`);
    const url = `https://www.googleapis.com/drive/v3/files?q=${query}&spaces=appDataFolder&fields=files(id,name)`;
    const response = await fetch(url, {
        headers: {
            Authorization: `Bearer ${googleAccessToken}`
        }
    });
    if (!response.ok) {
        const text = await response.text();
        console.error('Drive file info error', response.status, text);
        throw new Error(`Unable to query Drive file: ${response.status} ${text}`);
    }
    const data = await response.json();
    return data.files?.[0] || null;
}

async function createDriveBookmarksFile(payload) {
    const metadata = {
        name: DRIVE_FILE_NAME,
        parents: ['appDataFolder']
    };
    const formData = new FormData();
    formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    formData.append('file', new Blob([payload], { type: 'application/json' }));
    const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: {
            Authorization: `Bearer ${googleAccessToken}`
        },
        body: formData
    });
    if (!response.ok) {
        const text = await response.text();
        console.error('Drive create file error', response.status, text);
        throw new Error(`Unable to create Drive file: ${response.status} ${text}`);
    }
    return response.json();
}

async function updateDriveBookmarksFile(fileId, payload) {
    const metadata = { name: DRIVE_FILE_NAME };
    const formData = new FormData();
    formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    formData.append('file', new Blob([payload], { type: 'application/json' }));
    const response = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`, {
        method: 'PATCH',
        headers: {
            Authorization: `Bearer ${googleAccessToken}`
        },
        body: formData
    });
    if (!response.ok) {
        const text = await response.text();
        console.error('Drive update file error', response.status, text);
        throw new Error(`Unable to update Drive file: ${response.status} ${text}`);
    }
    return response.json();
}

async function loadBookmarksFromDrive() {
    if (!googleAccessToken) return;
    try {
        const fileInfo = await fetchDriveFileInfo();
        if (!fileInfo) {
            const payload = JSON.stringify(apps, null, 2);
            const created = await createDriveBookmarksFile(payload);
            googleDriveFileId = created.id;
            return;
        }
        googleDriveFileId = fileInfo.id;
        const response = await fetch(`https://www.googleapis.com/drive/v3/files/${fileInfo.id}?alt=media`, {
            headers: {
                Authorization: `Bearer ${googleAccessToken}`
            }
        });
        if (!response.ok) {
            throw new Error('Unable to load Drive bookmarks');
        }
        const remoteApps = await response.json();
        if (Array.isArray(remoteApps)) {
            apps = remoteApps;
            saveApps();
            renderApps();
        }
    } catch (error) {
        console.error('loadBookmarksFromDrive error', error);
        if (error.message.includes('401') || error.message.includes('403')) {
            signOutOfGoogle();
            showToast('Google auth issue. Please sign in again.');
            return;
        }
        showToast('Google Drive sync failed');
    }
}

async function syncBookmarksToDrive() {
    if (!googleAccessToken) return;
    try {
        console.log('Syncing bookmarks to Drive...');
        const payload = JSON.stringify(apps, null, 2);
        const fileInfo = googleDriveFileId ? { id: googleDriveFileId } : await fetchDriveFileInfo();
        if (!fileInfo) {
            const created = await createDriveBookmarksFile(payload);
            googleDriveFileId = created.id;
            console.log('Created bookmarks.json in Drive', googleDriveFileId);
        } else {
            await updateDriveBookmarksFile(fileInfo.id, payload);
            googleDriveFileId = fileInfo.id;
            console.log('Updated bookmarks.json in Drive', googleDriveFileId);
        }
    } catch (error) {
        console.error('syncBookmarksToDrive error', error);
        showToast('Failed to save bookmarks to Drive');
    }
}

/* =========================================================
   FAVICON
========================================================= */

function getFavicon(url) {

    try {

        const domain =
            new URL(url).hostname;

        return (
            "https://www.google.com/s2/favicons" +
            "?domain=" +
            encodeURIComponent(domain) +
            "&sz=128"
        );

    } catch {

        return "";

    }

}


/* =========================================================
   ICON LOADING
========================================================= */

function loadIcon(
    img,
    app,
    fallback
) {

    const automaticIcon =
        getFavicon(
            app.url
        );


    /*
      Priority:

      1. Custom icon
      2. Google favicon
      3. Letter fallback
    */

    if (
        app.customIcon
    ) {

        img.src =
            app.customIcon;

        img.onerror =
            () => {

                img.onerror =
                    () => {

                        showFallback(
                            img,
                            fallback
                        );

                    };

                img.src =
                    automaticIcon;

            };

        return;

    }


    img.src =
        automaticIcon;

    img.onerror =
        () => {

            showFallback(
                img,
                fallback
            );

        };

}


function showFallback(
    img,
    letter
) {

    const parent =
        img.parentElement;

    img.remove();

    const fallback =
        document.createElement(
            "div"
        );

    fallback.className =
        "fallback-icon";

    fallback.textContent =
        letter;

    parent.appendChild(
        fallback
    );

}


/* =========================================================
   RENDER APPS
========================================================= */

function renderApps() {

    const query =
        searchInput.value
            .trim()
            .toLowerCase();


    const filtered =
        apps.filter(
            app =>
                app.name
                    .toLowerCase()
                    .includes(query)

                ||

                app.url
                    .toLowerCase()
                    .includes(query)
        );


    appGrid.innerHTML =
        "";


    filtered.forEach(
        app => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "app-item";


            item.addEventListener(
                "click",
                event => {

                    if (
                        event.target.closest(
                            ".app-controls"
                        )
                    ) {

                        return;

                    }

                    if (
                        editMode
                    ) {

                        return;

                    }

                    window.location.href =
                        app.url;

                }
            );


            let timer;


            item.addEventListener(
                "pointerdown",
                () => {

                    if (
                        editMode
                    ) {

                        return;

                    }

                    timer =
                        setTimeout(
                            enableEditMode,
                            650
                        );

                }
            );


            [
                "pointerup",
                "pointerleave",
                "pointercancel"
            ].forEach(
                eventName => {

                    item.addEventListener(
                        eventName,
                        () => {

                            clearTimeout(
                                timer
                            );

                        }
                    );

                }
            );


            /* Controls */

            const controls =
                document.createElement(
                    "div"
                );

            controls.className =
                "app-controls";


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "control-button";

            deleteButton.innerHTML =
                "×";


            deleteButton.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    deleteApp(
                        app.id
                    );

                }
            );


            const editButton =
                document.createElement(
                    "button"
                );

            editButton.className =
                "control-button edit";

            editButton.innerHTML =
                "✎";


            editButton.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    openEditModal(
                        app
                    );

                }
            );


            controls.appendChild(
                deleteButton
            );

            controls.appendChild(
                editButton
            );


            /* Icon */

            const icon =
                document.createElement(

                "app-icon";

                document.createElement(
                    "img"
                );

            img.alt =
                app.name;

            img.loading =
                "lazy";

                img,
                app,
                app.name

                    .toUpperCase()
            );


            icon.appendChild(
                img
            );


            /* Name */

                document.createElement(

                );

/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now =
        new Date();


    let hours =
        now.getHours();


    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );


    const seconds =
        String(
            now.getSeconds()
        ).padStart(
            2,
            "0"
        );


    const period =
        hours >= 12
            ? "PM"
            : "AM";


    hours =
        hours % 12 || 12;


    document.getElementById(
        "clockTime"
    ).textContent =
        `${hours}:${minutes}:${seconds}`;


    document.getElementById(
        "clockPeriod"
    ).textContent =
        period;


    document.getElementById(
        "currentDate"
    ).textContent =
        new Intl.DateTimeFormat(
            undefined,
            {
                weekday:
                    "long",

                month:
                    "long",

                day:
                    "numeric"
            }
        ).format(
            now
        );

}


updateClock();

setInterval(
    updateClock,
    1000
);

/* =========================================================
   SAVE APP
========================================================= */

bookmarkForm.addEventListener(
    "submit",
    event => {

        event.preventDefault();


        const name =
            nameInput.value.trim();


        let url =
            urlInput.value.trim();


        const customIcon =
            customIconInput.value.trim();


        if (
            !/^https?:\/\//i.test(
                url
            )
        ) {

            url =
                "https://" +
                url;

        }


        try {

            const parsed =
                new URL(
                    url
                );


            if (
                ![
                    "http:",
                    "https:"
                ].includes(
                    parsed.protocol
                )
            ) {

                throw new Error();

            }

        } catch {

            formError.textContent =
                "Please enter a valid website URL.";

            return;

        }


        if (
            customIcon
        ) {

            try {

                const parsedIcon =
                    new URL(
                        customIcon
                    );


                if (
                    ![
                        "http:",
                        "https:"
                    ].includes(
                        parsedIcon.protocol
                    )
                ) {

                    throw new Error();

                }

            } catch {

                formError.textContent =
                    "Please enter a valid custom icon URL.";

                return;

            }

        }


        if (
            editingId
        ) {

            apps =
                apps.map(
                    app =>
                        app.id === editingId
                            ? {
                                ...app,
                                name,
                                url,
                                customIcon
                            }
                            : app
                );


            showToast(
                "App updated"
            );

        } else {

            apps.push({

                id:
                    crypto.randomUUID(),

                name,

                url,

                customIcon

            });


            showToast(
                "App added"
            );

        }


        saveApps();

        renderApps();

        closeAppModal();

    }
);


/* =========================================================
   DELETE
========================================================= */

function deleteApp(
    id
) {

    const app =
        apps.find(
            item =>
                item.id === id
        );


    if (
        !app
    ) {

        return;

    }


    if (
        !confirm(
            `Remove "${app.name}" from your Home Screen?`
        )
    ) {

        return;

    }


    apps =
        apps.filter(
            item =>
                item.id !== id
        );


    saveApps();

    renderApps();

    showToast(
        "App removed"
    );

}

function systemTheme() {

        "(prefers-color-scheme: dark)"
    ).matches

}


function applyTheme(
    preference
) {

    localStorage.setItem(
        THEME_KEY,
        preference
    );


    document.documentElement
        .setAttribute(
            "data-theme",
            preference === "system"
                ? systemTheme()
                : preference
        );


    document
        .querySelectorAll(
            ".theme-option"
        )
        .forEach(
            option => {

                option.classList.toggle(
                    "active",
                    option.dataset.themeChoice ===
                    preference
                );

            }
        );

}

/* =========================================================
   INDEXEDDB WALLPAPER STORAGE
========================================================= */

function openDB() {

    return new Promise(
        (resolve, reject) => {

            const request =
                indexedDB.open(
                    DB_NAME,
                    1
                );


            request.onupgradeneeded =
                () => {

                    const db =
                        request.result;


                    if (
                        !db.objectStoreNames
                            .contains(
                                DB_STORE
                            )
                    ) {

                        db.createObjectStore(
                            DB_STORE
                        );

                    }

                };


            request.onsuccess =
                () =>
                    resolve(
                        request.result
                    );


            request.onerror =
                () =>
                    reject(
                        request.error
                    );

        }
    );

}


async function saveWallpaper(
    blob
) {

    const db =
        await openDB();


    return new Promise(
        (resolve, reject) => {

            const transaction =
                db.transaction(
                    DB_STORE,
                    "readwrite"
                );


            transaction.objectStore(
                DB_STORE
            ).put(
                blob,
                "wallpaper"
            );


            transaction.oncomplete =
                resolve;


            transaction.onerror =
                () =>
                    reject(
                        transaction.error
                    );

        }
    );

}


async function getWallpaper() {

    try {

        const db =
            await openDB();


        return new Promise(
            resolve => {

                const request =
                    db.transaction(
                        DB_STORE,
                        "readonly"
                    )
                    .objectStore(
                        DB_STORE
                    )
                    .get(
                        "wallpaper"
                    );


                request.onsuccess =
                    () =>
                        resolve(
                            request.result
                        );


                request.onerror =
                    () =>
                        resolve(
                            null
                        );

            }
        );

    } catch {

        return null;

    }

}


async function deleteWallpaper() {

    const db =
        await openDB();


    return new Promise(
        resolve => {

            const request =
                db.transaction(
                    DB_STORE,
                    "readwrite"
                )
                .objectStore(
                    DB_STORE
                )
                .delete(
                    "wallpaper"
                );


            request.onsuccess =
                resolve;

        }
    );

}

function applyWallpaperStyle() {

    wallpaper.style.filter =
        `blur(${settings.blur}px)`;

        settings.blur > 0
            ? `scale(${1 + settings.blur / 100})`
            : "scale(1)";


    document
        .querySelector(
            ".wallpaper-overlay"
        )
        .style.background =
        `rgba(0,0,0,${settings.dim / 100})`;

}


async function loadSavedWallpaper() {

    const blob =
        await getWallpaper();


    if (
        blob
    ) {

        const url =
            URL.createObjectURL(
                blob
            );

        wallpaper.style.backgroundImage =
            `url("${url}")`;

        wallpaper.classList.add(
            "has-image"
        );

        return;

    }


    if (
        settings.wallpaperUrl
    ) {

        wallpaper.style.backgroundImage =
            `url("${settings.wallpaperUrl}")`;

        wallpaper.classList.add(
            "has-image"
        );

    }

}
